<style>
  .hv-error { color: var(--homey-color-danger, #e00); margin: 12px 0; }
</style>

<p class="homey-subtitle" data-i18n="pair.manual_intro"></p>
<form id="man-form" class="homey-form" action="javascript:void(0)">
  <div class="homey-form-group">
    <label class="homey-form-label" for="man-host" data-i18n="pair.host_label"></label>
    <input class="homey-form-input" id="man-host" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
  </div>
  <p id="man-error" class="hv-error" hidden></p>
  <button type="submit" class="homey-button-primary-full" data-i18n="pair.next"></button>
</form>

<script type="application/javascript">
  (function () {
    var error = document.getElementById('man-error');
    document.getElementById('man-host').placeholder = Homey.__('pair.host_placeholder');
    document.getElementById('man-form').addEventListener('submit', function (e) {
      e.preventDefault();
      error.hidden = true;
      var value = document.getElementById('man-host').value.trim();
      // host, host:port, [IPv6]:port or a bare IPv6 address (more than one colon, no port)
      var host = value, port;
      var bracket = value.match(/^\[([^\]]+)\](?::(\d+))?$/);
      if (bracket) { host = bracket[1]; port = bracket[2]; }
      else if (value.split(':').length === 2) { host = value.split(':')[0]; port = value.split(':')[1]; }
      Homey.emit('set_host', { host: host, port: port })
        .then(function () { Homey.showView('api_key'); })
        .catch(function (err) {
          error.textContent = err && err.message ? err.message : String(err);
          error.hidden = false;
        });
    });
  }());
</script>
